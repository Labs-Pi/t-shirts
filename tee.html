<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Tee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Pinyon+Script&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a44; --muted:#77787d; --bg1:#f1efea; --bg2:#d9d6cf; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:Inter,system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
    background:radial-gradient(ellipse 70% 60% at 50% 42%, var(--bg1), var(--bg2)); }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c.drag { cursor:grabbing; }
  header { position:fixed; top:0; left:0; right:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:22px 28px; pointer-events:none; }
  header > :first-child { justify-self:start; } header > :last-child { justify-self:end; }
  header a { pointer-events:auto; font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); text-decoration:none; }
  .tabs { pointer-events:auto; display:flex; gap:2px; padding:3px; border-radius:999px; background:rgba(31,42,68,.07); }
  header .tabs a { padding:6px 14px; border-radius:999px; opacity:1; transition:background .2s,color .2s; }
  header .tabs a:hover { background:rgba(31,42,68,.08); }
  header .tabs a[aria-current=page], header .tabs a[aria-current=page]:hover { background:var(--ink); color:#f1efea; }
  .logo { font-family:Yellowtail,cursive; font-size:26px; line-height:.72; transform:rotate(-7deg); text-align:center; }
  .logo span { display:block; } .logo span + span { margin-left:22px; }
  .panel { position:fixed; left:28px; bottom:28px; max-width:calc(100% - 56px); }
  .panel h1 { margin:0; font-size:20px; font-weight:500; letter-spacing:-.01em; }
  .panel .price { margin-top:4px; font-size:13px; color:var(--muted); }
  .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .label { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); width:44px; }
  .sw { width:22px; height:22px; border-radius:50%; border:0; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); outline-offset:3px; transition:transform .2s; }
  .sw:hover { transform:scale(1.12); }
  .sw[aria-pressed=true] { outline:1.5px solid var(--ink); }
  .chip { border:1px solid rgba(31,42,68,.25); background:transparent; color:var(--ink); border-radius:999px; padding:6px 12px; font:500 11px Inter,sans-serif; cursor:pointer; transition:.2s; }
  .chip[aria-pressed=true] { background:var(--ink); color:#f1efea; border-color:var(--ink); }
  .hint { position:fixed; right:28px; bottom:30px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  #loader { position:fixed; inset:0; display:grid; place-items:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); transition:opacity .6s; pointer-events:none; }
  #loader.off { opacity:0; }
  @media (max-width:640px) { .hint { display:none; } .panel { left:16px; bottom:18px; } header { padding:16px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <nav class="tabs" aria-label="Pages"><a href="index.html">Rack</a><a href="tee.html" aria-current="page">Tee</a></nav>
  <div class="logo"><span>Loose</span><span>Thread</span></div>
  <a href="#">Bag (0)</a>
</header>
<div class="panel">
  <h1>Everyday Heavyweight Tee</h1>
  <div class="price">$38 · 240 gsm combed cotton</div>
  <div class="row" id="colors"><span class="label">Color</span></div>
  <div class="row" id="prints"><span class="label">Print</span></div>
</div>
<div class="hint">Drag to rotate</div>
<div id="loader">Loading tee…</div>

<script src="shirt-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

await Promise.race([
  Promise.all(['40px Yellowtail', '40px "Pinyon Script"', '700 20px Inter'].map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 2500)),
]);

const COLORS = [
  { name: 'Bone', hex: '#ece7dc' }, { name: 'Black', hex: '#1b1b1e' }, { name: 'Forest', hex: '#1f4a3a' },
  { name: 'Heather', hex: '#8b8c90' }, { name: 'Blush', hex: '#ead2cc' }, { name: 'Navy', hex: '#26304a' },
];
const PRINTS = ['None', 'Logo', 'Script'];
const state = { color: COLORS[0].hex, print: 'Logo' };
const hc = location.hash.match(/c=(\d)/); if (hc) state.color = COLORS[+hc[1]].hex;
const isDark = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 0.3 + (n >> 8 & 255) * 0.59 + (n & 255) * 0.11) < 110; };

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.8;
new RGBELoader().load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr', hdr => {
  scene.environment = pmrem.fromEquirectangular(hdr).texture; hdr.dispose();
  scene.environmentIntensity = 1.3;
});

const camera = new THREE.PerspectiveCamera(25, 1, 0.05, 50);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(-0.7, 1.3, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 18; key.shadow.blurSamples = 24;
key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -0.8, right: 0.8, top: 0.8, bottom: -0.8, near: 0.5, far: 6 });
scene.add(key);

// soft shadow on an invisible backdrop
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.1 }));
backdrop.position.z = -0.42; backdrop.receiveShadow = true; scene.add(backdrop);

// ---------------------------------------------------------------- fabric motion (shared by shirt + print)
const U = { uTime: { value: 0 }, uPush: { value: new THREE.Vector3(0, 0, 9) }, uPushAmt: { value: 0 } };
function addFabricMotion(mat) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = 'uniform float uTime; uniform vec3 uPush; uniform float uPushAmt;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      // light breeze, stronger toward the hem and sleeve ends
      float hem = smoothstep(0.02, -0.3, position.y) + smoothstep(0.17, 0.27, abs(position.x)) * 0.6;
      float w = sin(uTime * 1.5 + position.y * 13.0 + position.x * 5.0) * 0.6 + sin(uTime * 2.2 + position.x * 17.0 - position.y * 4.0) * 0.4;
      // move every layer (outer fabric, hem fold, inside) the same way so seams never split open
      vec3 radial = normalize(vec3(position.x, 0.0, position.z) + vec3(0.0, 0.0, 1e-4));
      transformed += radial * w * 0.0028 * hem;
      // fingertip press where the cursor touches
      float d = distance(position, uPush);
      transformed -= radial * uPushAmt * exp(-d * d / 0.0035);
    `);
  };
}

// ---------------------------------------------------------------- prints
function printTexture(kind, dark) {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'), ink = dark ? '#efe9dc' : '#1d2340';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = ink;
  if (kind === 'Logo') {
    x.save(); x.translate(S / 2, S * 0.46); x.rotate(-0.12);
    x.font = `${S * 0.2}px Yellowtail`; x.fillText('Loose', -S * 0.06, -S * 0.08); x.fillText('Thread', S * 0.07, S * 0.1);
    x.restore();
    x.font = `700 ${S * 0.032}px Inter`; if ('letterSpacing' in x) x.letterSpacing = '10px';
    x.fillText('EST. 2026 · GARMENT CLUB', S / 2, S * 0.72);
  } else if (kind === 'Script') {
    x.font = `${S * 0.15}px "Pinyon Script"`;
    x.fillText('Stay Soft,', S / 2, S * 0.3); x.fillText('Stay', S / 2, S * 0.45); x.fillText('Strange', S / 2, S * 0.6);
    x.font = `700 ${S * 0.03}px Inter`; if ('letterSpacing' in x) x.letterSpacing = '10px';
    x.fillText('LOOSE THREAD', S / 2, S * 0.75);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------------------------------------------------------------- shirt
// The model's baked AO has a large dark smear across the back panel (right half of the atlas).
// Rebuild the back from max(back, mirrored front): the clean front panel fills the smear,
// while real seam/fold occlusion that exists on both sides survives.
function cleanAO(tex) {
  const img = tex.image, w = img.width, h = img.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), px = d.data, yMax = Math.round(h * 0.72);
  for (let y = 0; y < yMax; y++) for (let X = w >> 1; X < w; X++) {
    const i = (y * w + X) * 4, j = (y * w + (w - 1 - X)) * 4;
    if (px[j] < 8) continue; // mirrored point falls outside the front island
    const v = Math.max(px[i], px[j]);
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.flipY = tex.flipY; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT; t.colorSpace = tex.colorSpace; t.channel = tex.channel;
  return t;
}
const rig = new THREE.Group(); scene.add(rig);
let shirt, shirtMat, decal;
{
  const bin = Uint8Array.from(atob(window.SHIRT_GLB), ch => ch.charCodeAt(0)).buffer;
  const gltf = await new GLTFLoader().parseAsync(bin, '');
  shirt = gltf.scene.getObjectByName('T_Shirt_male');
  const src = shirt.material;
  shirt.geometry.center();
  shirtMat = new THREE.MeshPhysicalMaterial({
    color: state.color, roughness: 1, metalness: 0,
    sheen: 1, sheenRoughness: 0.55, sheenColor: new THREE.Color(state.color).lerp(new THREE.Color('#ffffff'), 0.25),
    normalMap: src.normalMap, normalScale: new THREE.Vector2(1.4, 1.4),
    aoMap: cleanAO(src.aoMap), aoMapIntensity: 1, side: THREE.DoubleSide,
  });
  addFabricMotion(shirtMat);
  shirt.material = shirtMat;
  shirt.castShadow = true;
  shirt.position.set(0, 0, 0); shirt.rotation.set(0, 0, 0); shirt.scale.setScalar(1);
  rig.add(shirt);
  rig.updateMatrixWorld(true);

  // find the chest surface and project the print onto it
  const hit = new THREE.Raycaster(new THREE.Vector3(0, 0.1, 2), new THREE.Vector3(0, 0, -1)).intersectObject(shirt)[0];
  const at = hit ? hit.point : new THREE.Vector3(0, 0.1, 0.14);
  const geo = new DecalGeometry(shirt, at, new THREE.Euler(0, 0, 0), new THREE.Vector3(0.24, 0.24, 0.18));
  const decalMat = new THREE.MeshPhysicalMaterial({
    transparent: true, roughness: 0.9, sheen: 0.4, sheenRoughness: 0.7,
    normalMap: src.normalMap, normalScale: new THREE.Vector2(1, 1),
    polygonOffset: true, polygonOffsetFactor: -4, depthWrite: false,
  });
  addFabricMotion(decalMat);
  decal = new THREE.Mesh(geo, decalMat);
  shirt.add(decal); // geometry is already in shirt space (shirt sits at identity)
}

function applyPrint() {
  decal.visible = state.print !== 'None';
  if (!decal.visible) return;
  decal.material.map?.dispose();
  decal.material.map = printTexture(state.print, isDark(state.color));
  decal.material.needsUpdate = true;
}
applyPrint();

// ---------------------------------------------------------------- UI
const colorRow = document.getElementById('colors'), printRow = document.getElementById('prints');
const targetColor = new THREE.Color(state.color);
for (const c of COLORS) {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c.hex; b.title = c.name; b.setAttribute('aria-label', c.name);
  b.setAttribute('aria-pressed', c.hex === state.color);
  b.onclick = () => {
    const flip = isDark(c.hex) !== isDark(state.color);
    state.color = c.hex; targetColor.set(c.hex);
    colorRow.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s === b));
    if (flip) applyPrint();
  };
  colorRow.appendChild(b);
}
for (const p of PRINTS) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = p; b.setAttribute('aria-pressed', p === state.print);
  b.onclick = () => { state.print = p; printRow.querySelectorAll('.chip').forEach(s => s.setAttribute('aria-pressed', s === b)); applyPrint(); };
  printRow.appendChild(b);
}

// ---------------------------------------------------------------- interaction
const pointer = new THREE.Vector2(), ray = new THREE.Raycaster();
let yaw = /y=b/.test(location.hash) ? Math.PI : 0, yawVel = 0, dragging = false, lastX = 0, hovering = false;
rig.rotation.y = yaw;
const pushTarget = new THREE.Vector3(0, 0, 9);
let pushAmtTarget = 0, pushVel = 0;

canvas.addEventListener('pointermove', e => {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (dragging) { const dx = e.clientX - lastX; lastX = e.clientX; yaw += dx * 0.01; yawVel = dx * 0.01 * 60; return; }
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObject(shirt, false)[0];
  hovering = !!hit;
  if (hit) { pushTarget.copy(shirt.worldToLocal(hit.point.clone())); pushAmtTarget = 0.007; }
  else pushAmtTarget = 0;
});
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; yawVel = 0; pushAmtTarget = 0; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
const end = () => { dragging = false; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
canvas.addEventListener('pointerleave', () => { pushAmtTarget = 0; pointer.set(0, 0); });
canvas.addEventListener('dblclick', () => { yaw = Math.round(yaw / (Math.PI * 2)) * Math.PI * 2; });

// ---------------------------------------------------------------- sizing
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(0.62 / 0.62 / (2 * tan), 0.56 / 0.7 / (2 * tan * camera.aspect));
  camera.position.set(0, 0.02, d);
  camera.lookAt(0, -0.01, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  U.uTime.value = t;

  if (!dragging) { yaw += yawVel * dt; yawVel *= Math.exp(-3.5 * dt); }
  const lookYaw = dragging ? 0 : pointer.x * 0.28, lookPitch = dragging ? 0 : -pointer.y * 0.1;
  rig.rotation.y = damp(rig.rotation.y, yaw + lookYaw, 6, dt);
  rig.rotation.x = damp(rig.rotation.x, lookPitch, 6, dt);
  rig.rotation.z = Math.sin(t * 0.7) * 0.012;
  rig.position.y = Math.sin(t * 0.9) * 0.004;

  // springy press so the fabric gives a little and settles back
  U.uPush.value.lerp(pushTarget, 1 - Math.exp(-14 * dt));
  pushVel += ((pushAmtTarget - U.uPushAmt.value) * 140 - pushVel * 13) * dt;
  U.uPushAmt.value += pushVel * dt;

  shirtMat.color.lerp(targetColor, 1 - Math.exp(-8 * dt));
  shirtMat.sheenColor.copy(shirtMat.color).lerp(new THREE.Color('#ffffff'), 0.25);

  renderer.render(scene, camera);
});
document.getElementById('loader').classList.add('off');
</script>
</body>
</html>
